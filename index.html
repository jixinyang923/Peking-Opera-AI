<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 提示词注入枢纽 & 全息潜空间实验室 - 完整闭环版</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        /* ================= 字体定义 ================= */
        @font-face {
            font-family: 'AlimamaShuHeiTi';
            src: url('Alimama_ShuHeiTi_Bold.ttf') format('truetype');
            font-weight: normal; font-style: normal;
        }
        @font-face {
            font-family: 'HYPixel';
            src: url('HYPixel11pxU-2.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        /* ================= 全局基础 ================= */
        :root { --accent: #00E5FF; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #050505; font-family: 'Inter', sans-serif; color: white; }
        * { box-sizing: border-box; }

        /* ================= PAGE 1: 枢纽层 ================= */
        #underlying-page {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
            background: radial-gradient(circle at center, #100612 0%, #000000 100%);
            transform: scale(0.9); transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); transform-origin: center center;
        }
        #ui-layer.zoom-reveal { transform: scale(3); opacity: 0; pointer-events: none; }
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .input-wrapper { display: flex; flex-direction: column; align-items: center; z-index: 10; width: 100%; }
        .title-container { display: flex; flex-direction: column; align-items: center; width: 60vw; max-width: 800px; margin-bottom: 50px; }
        .main-title { font-family: 'AlimamaShuHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #FFFFFF; font-size: clamp(40px, 7vw, 86px); font-weight: normal; letter-spacing: clamp(5px, 1.5vw, 14px); text-shadow: 0 0 25px rgba(0, 229, 255, 0.6), 0 0 10px rgba(0, 229, 255, 0.4); margin: 0; line-height: 1.1; white-space: nowrap; text-align: center; }
        .sub-title { font-family: 'AlimamaShuHeiTi', 'Inter', sans-serif; color: rgba(255, 255, 255, 0.6); font-size: clamp(12px, 1.5vw, 18px); font-weight: normal; letter-spacing: clamp(3px, 0.5vw, 8px); margin-top: 15px; text-transform: uppercase; text-align: center; }
        
        .prompt-box { position: relative; display: flex; align-items: center; width: 60vw; max-width: 800px; height: 70px; border-radius: 35px; padding: 0 10px 0 30px; background: rgba(15, 18, 22, 0.6); backdrop-filter: blur(20px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.15); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease; }
        .prompt-box:focus-within { transform: scale(1.02); box-shadow: 0 20px 40px rgba(0, 229, 255, 0.15), 0 0 25px rgba(255, 0, 77, 0.1); }
        .prompt-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 35px; padding: 2px; background: linear-gradient(90deg, #FF004D, #00E5FF, #FF004D, #00E5FF, #FF004D); background-size: 200% 100%; animation: borderFlow 5s linear infinite; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
        @keyframes borderFlow { 0% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .prompt-box.error-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; box-shadow: 0 0 30px rgba(255, 0, 77, 0.4) !important; }
        .prompt-box.error-shake::before { background: linear-gradient(90deg, #FF004D, #FF3366, #FF004D) !important; animation: none !important; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0) scale(1.02); } 20%, 80% { transform: translate3d(4px, 0, 0) scale(1.02); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.02); } 40%, 60% { transform: translate3d(6px, 0, 0) scale(1.02); } }

        .sheen-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 35px; overflow: hidden; pointer-events: none; z-index: 1; }
        .sheen-layer::before { content: ''; position: absolute; top: -100px; bottom: -100px; width: 150px; background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.15) 0%, transparent 60%); animation: smoothGlide 4s linear infinite; will-change: transform; }
        @keyframes smoothGlide { 0% { transform: skewX(-15deg) translateX(-150px); } 100% { transform: skewX(-15deg) translateX(950px); } }

        .prompt-label { font-family: 'AlimamaShuHeiTi', monospace; background: linear-gradient(90deg, #FF004D, #00E5FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: normal; font-size: 18px; margin-right: 20px; letter-spacing: 1px; }
        .prompt-input { flex: 1; background: transparent; border: none; outline: none; color: #FFF; font-family: 'Inter', sans-serif; font-size: 20px; }
        .submit-btn { width: 50px; height: 50px; border-radius: 25px; background: linear-gradient(135deg, #FF004D, #00E5FF); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease; }
        .submit-btn:hover { transform: scale(1.1); }
        .submit-btn svg { width: 24px; height: 24px; fill: #FFF; transition: transform 0.3s ease; }
        .submit-btn svg path { stroke-width: 1.0 !important; }
        .submit-btn:hover svg { transform: translateX(3px); }
        .hint-text { margin-top: 24px; color: rgba(255, 255, 255, 0.6); font-family: 'AlimamaShuHeiTi', sans-serif; font-size: 15px; letter-spacing: 2px; filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.8)); }
        .hint-text span { font-family: 'AlimamaShuHeiTi', monospace; font-weight: normal; color: #FFFFFF; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }

        /* ================= 统一导航组件 ================= */
        .nav-buttons-container {
            position: fixed; top: 40px; left: 40px; z-index: 99999;
            display: flex; gap: 20px;
            opacity: 0; transform: translateX(-20px);
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: none;
        }
        #page2-wrapper.active .nav-buttons-container,
        #lab-wrapper.active .nav-buttons-container,
        #page4-wrapper.active .nav-buttons-container,
        #page5-wrapper.active .nav-buttons-container,
        #part2-wrapper.active .nav-buttons-container {
            opacity: 1; transform: translateX(0); transition-delay: 0.8s; pointer-events: auto;
        }
        .nav-btn { 
            background: transparent; border: none; outline: none;
            color: var(--accent); font-family: 'AlimamaShuHeiTi', 'JetBrains Mono', monospace; font-size: 16px; 
            font-weight: 600; letter-spacing: 2px; cursor: pointer; display: flex; 
            align-items: center; gap: 8px; transition: all 0.3s ease; padding: 0;
        }
        .nav-btn:hover { color: #FF004D; text-shadow: 0 0 10px rgba(255, 0, 77, 0.5); }
        .nav-btn svg { width: 18px; height: 18px; fill: currentColor; transition: transform 0.3s ease; }
        .nav-btn:hover svg { transform: translateX(-3px); }


        /* ================= PAGE 2: 潜空间画廊层 ================= */
        #page2-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5;
            background: var(--bg); font-family: "Courier New", monospace; color: white;
            overflow-x: hidden; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity 1s ease;
        }
        #page2-wrapper.active { opacity: 1; pointer-events: auto; }

        #viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; perspective: 1000px; background: transparent; overflow: hidden; pointer-events: none; }
        #world { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; pointer-events: none; }
        .fragment { position: absolute; top: 50%; left: 50%; width: 150px; height: 200px; margin-left: -75px; margin-top: -100px; background: #111; border: 1.5px solid rgba(255,255,255,0.3); background-size: cover; background-position: center; cursor: pointer; pointer-events: auto !important; z-index: 100; filter: brightness(0.9) contrast(1.1); transition: filter 0.3s, border 0.3s, box-shadow 0.3s; will-change: transform, opacity; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
        .fragment:hover { filter: brightness(1.2) contrast(1); border: 2px solid var(--accent); box-shadow: 0 0 40px var(--accent); z-index: 9999 !important; }
        
        .ui { position: fixed; top: 80px; left: 40px; z-index: 100; color: #444; font-size: 11px; pointer-events: none; text-transform: uppercase; line-height: 1.6;}
        .blink-text { animation: blink 1.5s step-start infinite; color: var(--accent); font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }

        #hover-tooltip { position: fixed; background: rgba(0, 15, 10, 0.95); color: #fff; font-size: 11px; padding: 6px 12px; border: 1px solid var(--accent); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); pointer-events: none; z-index: 10000; display: none; letter-spacing: 2px; font-weight: bold; text-transform: uppercase; font-family: 'HYPixel', sans-serif; }
        #hover-tooltip::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        #line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #singularity-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        #blackbox-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2; display: none; opacity: 0; transition: opacity 2s ease; }
        #blackbox-canvas { width: 100%; height: 100%; cursor: crosshair; pointer-events: auto; }
        
        #detail-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .detail-box { position: relative; padding: 3px; width: fit-content; max-width: 90vw; background: rgba(0, 15, 10, 0.9); overflow: hidden; box-shadow: 0 0 40px rgba(0, 229, 255, 0.2); box-sizing: border-box; border-radius: 4px; }
        .close-btn { position: absolute; top: 15px; right: 15px; color: var(--accent); cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 20px; transition: all 0.2s; background: rgba(0, 229, 255, 0.05); border: 1px dashed var(--accent); z-index: 10; width: 32px; height: 32px; border-radius: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .close-btn:hover { color: #000; background: var(--accent); border-style: solid; box-shadow: 0 0 15px var(--accent); }
        .detail-content { position: relative; z-index: 1; background: rgba(0, 12, 8, 0.98); padding: 50px 50px 40px 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; box-sizing: border-box; border: 2px dashed rgba(0, 229, 255, 0.8); box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.2), 0 0 10px rgba(0, 229, 255, 0.5); border-radius: 4px; }
        #t-img { display: block; max-width: 450px; max-height: 55vh; width: auto; height: auto; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.1)); border-radius: 4px; }
        #t-title { color: #fff; text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); margin: 25px 0 0 0; letter-spacing: 2px; text-align: center; font-family: 'HYPixel', 'Press Start 2P', monospace; font-size: 18px; line-height: 1.5; }
        
        .scroll-space { height: 1800vh; } 

        /* ================= PAGE 3: 终端解构实验室层 ================= */
        #lab-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 200;
            background: #000; overflow: hidden; display: none; opacity: 0; transition: opacity 1s ease;
        }
        #lab-wrapper canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 10;}
        #lab-wrapper video { display: none; }

        .content-placeholder { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            background: #000; color: #FFFFFF; 
            font-family: 'Press Start 2P', 'HYPixel', monospace; 
            font-size: 24px; z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 2s ease; 
        }

        .blinking-dots { display: inline; animation: dots-blink 1s step-end infinite; }
        @keyframes dots-blink { 50% { opacity: 0; } }

        .blinking-arrow-key {
            display: none; margin-top: 40px; padding: 10px 60px; 
            border: 2px solid white; text-align: center;
            font-family: 'Silkscreen', monospace; font-size: 24px;
            letter-spacing: -2px; cursor: pointer; 
            animation: key-blinking 1s step-end infinite; 
            pointer-events: auto; transition: all 0.3s ease;
        }
        .blinking-arrow-key:hover { 
            background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 20px var(--accent);
        }

        /* ================= PAGE 4: 矩阵崩溃层 ================= */
        #page4-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 300;
            background: #000; overflow: hidden; display: none; opacity: 0; transition: opacity 1s ease;
        }
        #networkCanvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; }

        /* ================= PAGE 5: 全息重构层 ================= */
        #page5-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 400;
            background: #000; overflow: hidden; display: none; opacity: 0; transition: opacity 1.5s ease;
        }
        #p5-canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: opacity 1s ease-in-out; }
        #p5-canvas-container canvas { display: block; }
        
        #p5-ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; transition: opacity 1s ease-in-out;
        }

        .track-label {
            position: absolute; color: #ffffff; font-family: monospace; font-size: 14px;
            pointer-events: none; text-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
            transform: translate(-50%, -50%); display: none; letter-spacing: 1px;
            opacity: 0; transition: opacity 0.5s ease; z-index: 11;
        }
        .track-line {
            position: absolute; width: 1px; background: rgba(255, 255, 255, 0.6);
            pointer-events: none; transform-origin: top left;
            opacity: 0; transition: opacity 0.5s ease; z-index: 11;
        }
        .gaze-label {
            position: absolute; color: #88ffff; font-family: 'Courier New', monospace; 
            font-size: 10px; font-weight: bold; pointer-events: none; 
            text-shadow: 0 0 5px rgba(136,255,255,0.8);
            transform: translate(4px, -50%); display: none; letter-spacing: 0.5px;
            white-space: nowrap; z-index: 11;
        }

        /* 全息进度条 UI */
        #progress-container {
            position: absolute; bottom: 30px; left: 5%; width: 90%;
            height: 2px; background: rgba(255, 255, 255, 0.15);
            z-index: 100; pointer-events: none;
        }
        #progress-bar {
            height: 100%; width: 0%; background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            transition: width 0.1s linear;
        }
        #progress-text {
            position: absolute; bottom: 12px; right: 0;
            color: #ffffff; font-family: 'Courier New', monospace;
            font-size: 14px; font-weight: bold; letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        /* 右下角呼吸闪烁箭头 (跳转直接触发 startPart2) */
        #next-btn {
            position: absolute; bottom: 40px; right: 5%;
            display: none; cursor: pointer; z-index: 150; pointer-events: auto;
            animation: breathe-arrow 2s infinite ease-in-out;
            padding: 10px;
        }
        @keyframes breathe-arrow {
            0% { opacity: 0.2; transform: translateX(0); }
            50% { opacity: 1.0; transform: translateX(5px); filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.8)); }
            100% { opacity: 0.2; transform: translateX(0); }
        }


        /* ================= PART 2: 最终生成成果与反思层 ================= */
        #part2-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10000;
            font-family: 'HYPixel', 'Courier New', Courier, monospace;
            background: linear-gradient(45deg, #0a0514, #1a0b2e, #0d1b2a, #110822);
            background-size: 400% 400%;
            animation: gradientFlow 12s ease infinite; 
            display: none; opacity: 0; transition: opacity 1.5s ease;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 场景1：加载画面 */
        #scene-loading {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; transition: opacity 0.8s ease; opacity: 0;
        }

        .pixel-circle {
            width: 320px; height: 320px; border-radius: 50%; margin-bottom: 50px;
            background-image: radial-gradient(circle, rgba(255,255,255,0.85) 1.5px, transparent 2px);
            background-size: 8px 8px; 
            -webkit-mask-image: radial-gradient(circle, black 30%, transparent 70%); 
            mask-image: radial-gradient(circle, black 30%, transparent 70%); 
            -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
            animation: part2-breathe 3s ease-in-out infinite; 
        }

        @keyframes part2-breathe {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        .loading-text { color: #ffffff; font-size: 24px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }

        /* 场景2：图片展示 */
        #scene-gallery {
            position: absolute; width: 100%; height: 100%;
            display: none; opacity: 0; padding: 50px 50px 100px 50px; z-index: 5; transition: opacity 0.8s ease;
        }

        .gallery-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 30px; height: 100%; }

        .gallery-item {
            width: 250px; height: 350px; object-fit: cover; border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 8px; cursor: pointer; opacity: 0; transform: translateY(60px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover { transform: translateY(-10px) scale(1.05) !important; border-color: #fff; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.2); }

        #scene-gallery.active .gallery-item { animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        #scene-gallery.active .gallery-item:nth-child(1) { animation-delay: 0.2s; }
        #scene-gallery.active .gallery-item:nth-child(2) { animation-delay: 0.4s; }
        #scene-gallery.active .gallery-item:nth-child(3) { animation-delay: 0.6s; }
        #scene-gallery.active .gallery-item:nth-child(4) { animation-delay: 0.8s; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        #finish-btn {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            padding: 8px 24px; background-color: transparent; border: 2px solid #fff; color: #fff;
            font-family: 'HYPixel', sans-serif; font-size: 20px; cursor: pointer; border-radius: 4px; 
            opacity: 0; transition: opacity 0.5s ease 1s, background-color 0.3s ease, transform 0.3s ease, border-color 0.3s ease; 
            animation: breathe-btn 2.5s ease-in-out infinite; z-index: 10;
        }
        #finish-btn:hover { background-color: rgba(255, 255, 255, 0.1); transform: translateX(-50%) scale(1.05); border-color: rgba(255, 255, 255, 0.8); }
        #scene-gallery.active #finish-btn { opacity: 1; }

        @keyframes breathe-btn {
            0%, 100% { transform: translateX(-50%) scale(0.98); opacity: 0.7; }
            50% { transform: translateX(-50%) scale(1.02); opacity: 1; }
        }

        /* 点击放大组件 */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9);
            display: none; justify-content: center; align-items: center; z-index: 100; opacity: 0; transition: opacity 0.3s ease; cursor: zoom-out;
        }
        #lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.8); transform: scale(0.9); transition: transform 0.3s ease; }
        #lightbox.show { display: flex; }
        #lightbox.show img { transform: scale(1); }

        /* 数字蓝屏故障特效层 */
        #scene-gallery.glitching { animation: heavy-video-tear 0.3s infinite steps(5); pointer-events: none; }
        @keyframes heavy-video-tear {
            0% { transform: translateX(0); filter: saturate(200%) contrast(150%); clip-path: inset(0 0 0 0); }
            20% { transform: translateX(40px) skewX(-5deg); filter: hue-rotate(90deg) invert(1); clip-path: inset(20% 0 50% 0); }
            40% { transform: translateX(-50px) skewX(10deg); filter: drop-shadow(15px 0 red) drop-shadow(-15px 0 cyan); clip-path: inset(60% 0 10% 0); }
            60% { transform: translateX(20px); filter: grayscale(1) contrast(300%); clip-path: inset(10% 0 80% 0); }
            80% { transform: translateX(-30px); filter: hue-rotate(-90deg) saturate(300%); clip-path: inset(80% 0 5% 0); }
            100% { transform: translateX(0); filter: none; clip-path: inset(0 0 0 0); }
        }

        #video-glitch-master { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 99; }
        #video-glitch-master.show { display: block; }
        .vgm-bsod {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #0000aa; color: #ffffff;
            font-family: 'Courier New', Courier, monospace; font-size: 14px; padding: 30px; line-height: 1.2; word-wrap: break-word; white-space: pre-wrap;
            opacity: 0; animation: vgm-bsod-flash 1.2s infinite linear;
        }
        @keyframes vgm-bsod-flash {
            0%, 9% { opacity: 0; } 10%, 15% { opacity: 1; transform: translateX(20px); clip-path: inset(10% 0 60% 0); }
            16%, 39% { opacity: 0; } 40%, 48% { opacity: 1; transform: translateX(-30px); clip-path: inset(50% 0 10% 0); filter: invert(1); }
            49%, 74% { opacity: 0; } 75%, 85% { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); } 86%, 100% { opacity: 0; }
        }
        .vgm-blackout { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; opacity: 0; animation: vgm-blackout-flash 0.9s infinite linear; }
        .vgm-blackout::before, .vgm-blackout::after { content: ''; position: absolute; background: #fff; }
        .vgm-blackout::before { animation: block-move-1 0.2s infinite steps(2); }
        .vgm-blackout::after { animation: block-move-2 0.3s infinite steps(3); }
        @keyframes vgm-blackout-flash { 0%, 25% { opacity: 0; } 26%, 35% { opacity: 1; } 36%, 65% { opacity: 0; } 66%, 72% { opacity: 1; filter: invert(1); } 73%, 100% { opacity: 0; } }
        @keyframes block-move-1 { 0% { top: 15%; left: 10%; width: 50%; height: 8%; } 50% { top: 60%; left: 40%; width: 30%; height: 15%; } 100% { top: 30%; left: 60%; width: 20%; height: 5%; } }
        @keyframes block-move-2 { 0% { top: 80%; left: 5%; width: 40%; height: 5%; } 50% { top: 10%; left: 70%; width: 10%; height: 40%; } 100% { top: 50%; left: 20%; width: 60%; height: 10%; } }
        .vgm-noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15; mix-blend-mode: overlay; pointer-events: none; animation: noise-shake 0.1s infinite alternate;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        @keyframes noise-shake { 0% { transform: translate(2px, 2px); opacity: 0.1; } 100% { transform: translate(-2px, -2px); opacity: 0.3; } }

        /* 场景3：高级版 AI 数据矩阵墙 */
        #scene-glitch {
            position: absolute; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #3a0000 0%, #050000 80%); 
            display: none; overflow: hidden; z-index: 10; opacity: 0; transition: opacity 1.5s ease;
        }

        #scene-glitch::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.95) 100%);
            pointer-events: none; z-index: 20;
        }

        #matrix-wall {
            position: absolute; left: 50%; top: 50%;
            width: 3500px; height: 2600px; margin-left: -1750px; margin-top: -1300px;
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center; align-content: center; transform-style: preserve-3d;
            animation: camera-pan 45s linear infinite alternate;
        }

        @keyframes camera-pan {
            0% { transform: perspective(1200px) rotateX(20deg) rotateY(-15deg) translateZ(-400px) translateX(-5%) translateY(-5%); }
            100% { transform: perspective(1200px) rotateX(-5deg) rotateY(15deg) translateZ(100px) translateX(5%) translateY(5%); }
        }

        .matrix-wrapper {
            width: 100px; height: 140px; opacity: 0;
            animation: data-pop-in 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes data-pop-in {
            0% { opacity: 0; transform: translateY(50px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .matrix-img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 4px;
            filter: grayscale(85%) brightness(0.3) contrast(1.2);
            transition: 0.5s; box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .matrix-img.analyzing {
            animation: ai-pulse 4s infinite alternate ease-in-out; position: relative;
        }

        @keyframes ai-pulse {
            0%, 20% { 
                filter: grayscale(85%) brightness(0.3); transform: scale(1); z-index: 1; 
                box-shadow: 0 5px 15px rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.05);
            }
            80%, 100% { 
                filter: grayscale(0%) brightness(1.2) contrast(1.1); transform: scale(1.15); z-index: 10; 
                box-shadow: 0 0 25px rgba(255, 60, 60, 0.8), 0 0 10px rgba(255, 255, 255, 0.5); 
                border-color: rgba(255,255,255,0.8);
            }
        }

        #next-arrow-btn {
            position: absolute; bottom: 50px; right: 50px;
            color: #ffffff; font-size: 36px; cursor: pointer;
            opacity: 0; pointer-events: none; z-index: 30; transition: opacity 1.5s ease;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            animation: arrow-bounce 2s infinite;
        }
        #next-arrow-btn.show { opacity: 1; pointer-events: auto; }
        #next-arrow-btn:hover { color: #ff9999; }

        @keyframes arrow-bounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(15px); }
        }

        /* 场景4：人工智能思考页 */
        #scene-ai-question {
            position: absolute; width: 100%; height: 100%;
            background-color: #000000; display: none; justify-content: center; align-items: center;
            z-index: 50; opacity: 0; transition: opacity 2s ease; 
        }

        .ai-question-text {
            color: #ffffff; font-size: 36px; letter-spacing: 6px; text-align: center; padding: 0 20px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            animation: gentle-breathe 4s infinite alternate;
        }

        @keyframes gentle-breathe {
            0% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 30px rgba(255, 255, 255, 0.5); }
        }
    </style>
</head>

    <script>
        // ================= 全局状态管理 & 导航路由 =================
        function resetLabState() {
            window.isUnlocked = false; window.isTyping = false;
            if(window.cnInterval) clearInterval(window.cnInterval);
            if(window.enInterval) clearInterval(window.enInterval);
            document.getElementById('finalScreen').style.opacity = '0';
            document.getElementById('finalScreen').style.pointerEvents = 'none';
            document.getElementById('blinkingArrowKey').style.display = 'none';
            document.getElementById('cnText').innerHTML = "准备生成";
            document.getElementById('enText').innerHTML = "";
            const v1 = document.getElementById('v1');
            if (v1) { v1.currentTime = 0; v1.play(); }
        }

        window.reverseReveal = function() { 
            document.getElementById('page2-wrapper').classList.remove('active');
            setTimeout(() => {
                document.getElementById('underlying-page').style.transform = "scale(0.9)";
                document.getElementById('ui-layer').classList.remove('zoom-reveal');
                document.getElementById('userInput').value = "";
                document.getElementById('userInput').placeholder = "Waiting for directives...";
            }, 800); 
        };

        window.returnToGallery = function() { 
            const labWrapper = document.getElementById('lab-wrapper');
            labWrapper.classList.remove('active'); labWrapper.style.opacity = '0';
            setTimeout(() => {
                labWrapper.style.display = 'none'; resetLabState();
                document.getElementById('underlying-page').style.display = 'flex';
                const p2 = document.getElementById('page2-wrapper');
                p2.style.display = 'block';
                setTimeout(() => { p2.style.opacity = '1'; p2.classList.add('active'); }, 50);
            }, 1000);
        };

        window.returnToLabFromPage4 = function() { 
            const p4 = document.getElementById('page4-wrapper');
            p4.classList.remove('active'); p4.style.opacity = '0';
            setTimeout(() => {
                p4.style.display = 'none';
                if (window.resetPage4) window.resetPage4();
                const labWrapper = document.getElementById('lab-wrapper');
                labWrapper.style.display = 'block'; void labWrapper.offsetWidth;
                labWrapper.style.opacity = '1'; labWrapper.classList.add('active');
                resetLabState(); 
            }, 1000);
        };

        window.returnToPage4FromPage5 = function() {
            const p5 = document.getElementById('page5-wrapper');
            p5.classList.remove('active'); p5.style.opacity = '0';
            setTimeout(() => {
                p5.style.display = 'none';
                if (window.resetPage5) window.resetPage5();
                
                const p4Wrapper = document.getElementById('page4-wrapper');
                p4Wrapper.style.display = 'block'; void p4Wrapper.offsetWidth;
                p4Wrapper.style.opacity = '1'; p4Wrapper.classList.add('active');
                if (window.resetPage4) window.resetPage4();
            }, 1000);
        };

        // 从终局结果页面返回到粒子重构页面
        window.returnToPage5FromPart2 = function() {
            const part2Wrapper = document.getElementById('part2-wrapper');
            part2Wrapper.style.opacity = '0';
            setTimeout(() => {
                part2Wrapper.style.display = 'none';
                
                // 完全重置第二部分的状态，以便下次还能正常进入
                document.getElementById('scene-loading').style.display = 'none';
                document.getElementById('scene-loading').style.opacity = '0';
                document.getElementById('scene-gallery').style.display = 'none';
                document.getElementById('scene-gallery').style.opacity = '0';
                document.getElementById('scene-gallery').classList.remove('active', 'glitching');
                document.getElementById('video-glitch-master').style.display = 'none';
                document.getElementById('video-glitch-master').classList.remove('show');
                document.getElementById('scene-glitch').style.display = 'none';
                document.getElementById('scene-glitch').style.opacity = '0';
                document.getElementById('matrix-wall').innerHTML = '';
                document.getElementById('next-arrow-btn').classList.remove('show');
                document.getElementById('scene-ai-question').style.display = 'none';
                document.getElementById('scene-ai-question').style.opacity = '0';

                // 重新显示第 5 页
                const p5Wrapper = document.getElementById('page5-wrapper');
                p5Wrapper.style.display = 'block';
                void p5Wrapper.offsetWidth;
                p5Wrapper.style.opacity = '1';
                p5Wrapper.classList.add('active');
            }, 1000);
        };

        window.goHome = function() { 
            ['lab-wrapper', 'page4-wrapper', 'page2-wrapper', 'page5-wrapper', 'part2-wrapper'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.classList.remove('active'); el.style.opacity = '0'; }
            });
            
            if(window.isTransitioning) window.isTransitioning = false;

            setTimeout(() => {
                ['lab-wrapper', 'page4-wrapper', 'page2-wrapper', 'page5-wrapper', 'part2-wrapper'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
                
                resetLabState();
                if (window.resetPage4) window.resetPage4();
                if (window.resetPage5) window.resetPage5(); 

                // 清理第二部分状态
                document.getElementById('scene-loading').style.display = 'none';
                document.getElementById('scene-loading').style.opacity = '0';
                document.getElementById('scene-gallery').style.display = 'none';
                document.getElementById('scene-gallery').style.opacity = '0';
                document.getElementById('scene-gallery').classList.remove('active', 'glitching');
                document.getElementById('video-glitch-master').style.display = 'none';
                document.getElementById('video-glitch-master').classList.remove('show');
                document.getElementById('scene-glitch').style.display = 'none';
                document.getElementById('scene-glitch').style.opacity = '0';
                document.getElementById('matrix-wall').innerHTML = '';
                document.getElementById('next-arrow-btn').classList.remove('show');
                document.getElementById('scene-ai-question').style.display = 'none';
                document.getElementById('scene-ai-question').style.opacity = '0';

                const p1Under = document.getElementById('underlying-page');
                p1Under.style.display = 'flex'; p1Under.style.transform = "scale(0.9)";
                const uiLayer = document.getElementById('ui-layer');
                uiLayer.style.display = 'flex'; uiLayer.classList.remove('zoom-reveal');
                const userInput = document.getElementById('userInput');
                userInput.value = ""; userInput.placeholder = "Waiting for directives...";
            }, 1000);
        };

        window.goToMatrixPage = function() { 
            const labWrapper = document.getElementById('lab-wrapper');
            labWrapper.style.opacity = '0';
            setTimeout(() => {
                labWrapper.classList.remove('active'); labWrapper.style.display = 'none'; resetLabState();
                const p4Wrapper = document.getElementById('page4-wrapper');
                p4Wrapper.style.display = 'block'; void p4Wrapper.offsetWidth; 
                p4Wrapper.style.opacity = '1'; p4Wrapper.classList.add('active'); 
                if (!window.p4Init) { window.initPage4(); window.p4Init = true; } 
                else { window.resetPage4(); }
            }, 1000);
        };

        window.goToPage5 = function() {
            const p4Wrapper = document.getElementById('page4-wrapper');
            p4Wrapper.classList.remove('active');
            p4Wrapper.style.opacity = '0';
            setTimeout(() => {
                p4Wrapper.style.display = 'none';
                if (window.resetPage4) window.resetPage4();

                const p5Wrapper = document.getElementById('page5-wrapper');
                p5Wrapper.style.display = 'block';
                void p5Wrapper.offsetWidth; 
                p5Wrapper.style.opacity = '1';
                p5Wrapper.classList.add('active');
                
                if (!window.p5Init) { window.initPage5(); window.p5Init = true; }
                else { window.resetPage5(); }
            }, 1000);
        };


        // ================= PAGE 1: 枢纽逻辑 =================
        (function() {
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.02); 
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 12;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, powerPreference: "high-performance" });

            function animateP1() {

                const time = clock.getElapsedTime();
                shaderUniforms.uTime.value = time;

                for(let i = 0; i < particleCount; i++) {
                    posAttr[i*3+1] -= speeds[i]; if(posAttr[i*3+1] < -15) posAttr[i*3+1] = 15;

                                data.velocity.add(impulse); other.userData.velocity.sub(impulse);

            async function initSceneP2() {

                    const progress = i / (count - 1);

            function getProjectedPos(x, y, z) {
                const rotY = p2MouseX * 6 * (Math.PI / 180); const rotX = -p2MouseY * 6 * (Math.PI / 180);
                let y1 = y * Math.cos(rotX) - z * Math.sin(rotX); let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
                let x2 = x * Math.cos(rotY) + z1 * Math.sin(rotY); let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);
                const perspective = 1000; const scale = perspective / (perspective - z2);
                return { x: window.innerWidth / 2 + x2 * scale, y: window.innerHeight / 2 + y1 * scale, visible: z2 < perspective - 100, zVal: z2, scale: scale };
            }

            function drawSingularity(scroll) {
                ctx.clearRect(0, 0, canvas.width, canvas.height); if (scroll < 0.5) return; 
                const intensity = mapRange(scroll, 0.5, 1.0, 0, 1); ctx.globalCompositeOperation = 'lighter';
                particles.forEach(p => {
                    p.angle += p.speed * (1 + intensity * 8); const r = p.radius * (1 - intensity * 0.99);

                    ctx.fillStyle = `rgba(0, 229, 255, ${intensity})`; ctx.fill();

            function drawBlackboxFrame(time) {
                const cx = bbCanvas.width / 2; const cy = bbCanvas.height / 2;
                if (isExploding) {

                    let elapsed = Date.now() - explosionStartTime; let speedMultiplier = 1 + Math.pow((elapsed / 800), 3); const perspective = 400; 
                    bbCtx.globalCompositeOperation = 'lighter';
                    explosionParticles.forEach(p => {
                        p.z -= p.speedZ * speedMultiplier;
                        if (p.z < 1) { p.z = 2000; p.x = (Math.random() - 0.5) * 2500; p.y = (Math.random() - 0.5) * 2500; }
                        if(Math.random() > 0.8) p.char = hexChars[Math.floor(Math.random() * 16)];
                        let scale = perspective / p.z; let projX = cx + p.x * scale; let projY = cy + p.y * scale;
                        if (projX > -100 && projX < bbCanvas.width + 100 && projY > -100 && projY < bbCanvas.height + 100) {
                            let alpha = mapRange(p.z, 0, 2000, 1, 0); 
                            bbCtx.fillStyle = Math.random() > 0.9 ? `rgba(255, 255, 255, ${alpha})` : `rgba(0, 229, 255, ${alpha})`;
                            bbCtx.font = `bold ${Math.max(8, 20 * scale)}px monospace`; bbCtx.fillText(p.char, projX, projY);
                        }
                    });
                    if (elapsed > 1600) { let whiteoutAlpha = (elapsed - 1600) / 600; bbCtx.fillStyle = `rgba(255, 255, 255, ${whiteoutAlpha})`; bbCtx.fillRect(0, 0, bbCanvas.width, bbCanvas.height); }
                    bbCtx.globalCompositeOperation = 'source-over';
                } else {
                    bbCtx.fillStyle = "rgba(0, 0, 0, 0.2)"; bbCtx.fillRect(0, 0, bbCanvas.width, bbCanvas.height); bbCtx.font = "8px monospace"; 
                    bgCodes.forEach(c => {

                    });
                    bbCtx.globalCompositeOperation = 'lighter'; const gridSize = 5, radius = 190;
                    for (let x = -radius; x < radius; x += gridSize) {
                        for (let y = -radius; y < radius; y += gridSize) {
                            const dist = Math.sqrt(x * x + y * y);
                            if (dist < radius - 10 + Math.sin(time * 2) * 20) {

            function mapRange(value, inMin, inMax, outMin, outMax) { return outMin + (outMax - outMin) * (Math.max(inMin, Math.min(inMax, value)) - inMin) / (inMax - inMin); }

            function animateP2() {

        window.initLab = function() {

                                const randFate = Math.random(); let scatterX = 0, scatterY = 0, scatterZ = 0, mobility = 1.0; 
                                if (randFate > 0.85) { scatterX = (Math.random() - 0.5) * 150; scatterY = (Math.random() - 0.5) * 150; scatterZ = (Math.random() - 0.5) * 80 + 20; mobility = 10.0; } 
                                else if (randFate > 0.40) { scatterX = (Math.random() - 0.5) * 20; scatterY = (Math.random() - 0.5) * 20; scatterZ = (Math.random() - 0.5) * 10 + 5; mobility = 3.5;  } 
                                else { scatterX = (Math.random() - 0.5) * 2; scatterY = (Math.random() - 0.5) * 2; scatterZ = (Math.random() - 0.5) * 2; mobility = 0.5; }

                                const r = 280 * Math.cbrt(Math.random()), theta = Math.random() * 2 * Math.PI, phi = Math.acos(2 * Math.random() - 1);
                                positions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi) + 80);
                                randomPositions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi) + 80);
                                targetPositions.push(tX + scatterX, tY + scatterY, tZ + scatterZ); mobilities.push(mobility); distRatios.push(distRatio); 
                                colors.push(Math.min(1.0, (imgData[i] / 255) * 1.1), Math.min(1.0, (imgData[i+1] / 255) * 1.1), Math.min(1.0, (imgData[i+2] / 255) * 1.1));
                                phases.push(Math.random() * Math.PI * 2);
                                if (Math.random() < 0.0008 && anchorPoints.length < 4) anchorPoints.push(new THREE.Vector3(tX, tY, tZ));
                            }
                        }
                    }
                    
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3)); geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    geometry.userData = { randomPositions: new Float32Array(randomPositions), targetPositions: new Float32Array(targetPositions), phases: new Float32Array(phases), mobilities: new Float32Array(mobilities), distRatios: new Float32Array(distRatios), progress: 0.0 };

                    particleSystem = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 1.1, vertexColors: true, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, map: glowTexture, depthWrite: false }));
                    scene.add(particleSystem);

                    anchorPoints.forEach(pos => {
                        const el = document.createElement('div'); el.className = 'track-label'; el.innerText = Math.floor(Math.random() * 90000 + 10000); 
                        const line = document.createElement('div'); line.className = 'track-line';
                        p5UiLayer.appendChild(el); p5UiLayer.appendChild(line); labels.push({ pos3D: pos, el: el, line: line });
                    });
                    imageState = 'FORMING';
                }; 
                // 若本地无文件同样会报错，但不影响结构，替换图片后正常运行
                img.onerror = () => { imageState = 'STAY'; stayTimer = 3; }; 
                img.src = imageUrl;
            }

            const clock = new THREE.Clock(); let timeTotal = 0;
            function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

            function updateLabels() {
                if (!particleSystem) return;
                const progress = particleSystem.geometry.userData.progress;
                labels.forEach(item => {
                    const vector = item.pos3D.clone(); vector.applyMatrix4(particleSystem.matrixWorld); vector.project(camera);
                    if (vector.z < 1) {
                        const x = (vector.x * .5 + .5) * window.innerWidth, y = (vector.y * -.5 + .5) * window.innerHeight;
                        item.el.style.display = 'block'; item.line.style.display = 'block';
                        item.el.style.left = `${x + 35}px`; item.el.style.top = `${y - 35}px`;  item.line.style.left = `${x}px`; item.line.style.top = `${y}px`;
                        item.line.style.height = `${Math.sqrt(35*35 + 35*35)}px`; item.line.style.transform = `rotate(-45deg)`;
                        let textAlpha = Math.pow(progress, 4); item.el.style.opacity = textAlpha; item.line.style.opacity = textAlpha * 0.6;
                    } else { item.el.style.display = 'none'; item.line.style.display = 'none'; }
                });
            }

            function animateP5() {
                animationId = requestAnimationFrame(animateP5); 
                if (!p5Wrapper.classList.contains('active')) return;
                
                controls.update(); 
                const delta = clock.getDelta(); timeTotal += delta;

                let isImageFormed = particleSystem && particleSystem.geometry.userData.progress > 0.85 && imageState !== 'DISPERSING';
                if (isImageFormed) { gazeSystem.group.visible = true; updateGazeSystem(); } 
                else { gazeSystem.group.visible = false; gazeSystem.boxes.forEach(box => { box.nodes.forEach(node => { node.el.style.display = 'none'; node.line.visible = false; }); }); }

                ambientGroup.children.forEach(pts => { pts.rotation.x += pts.userData.rx * delta; pts.rotation.y += pts.userData.ry * delta; });
                
                if (particleSystem) {
                    const pd = particleSystem.geometry.userData, mat = particleSystem.material, posArr = particleSystem.geometry.attributes.position.array;
                    
                    if (imageState === 'FORMING') {
                        if (pd.progress < 1.0) { pd.progress += delta * 0.12; if (pd.progress >= 1.0) { pd.progress = 1.0; imageState = 'STAY'; stayTimer = 0; } }
                    } else if (imageState === 'STAY') {
                        stayTimer += delta; if (stayTimer >= 3.0) imageState = 'DISPERSING';
                    } else if (imageState === 'DISPERSING') {
                        if (pd.progress > 0.0) {
                            pd.progress -= delta * 0.18; 
                            if (pd.progress <= 0.0) {
                                pd.progress = 0.0; currentImgIdx++;
                                if (currentImgIdx >= imageList.length) {
                                    currentImgIdx = 0; loopCount++;
                                    document.getElementById('next-btn').style.display = 'block'; 
                                }
                                loadDataImage(imageList[currentImgIdx]);
                            }
                        }
                    }
                    
                    let subP = 0;
                    if (imageState === 'FORMING') { subP = pd.progress * 0.4; } 
                    else if (imageState === 'STAY') { subP = 0.4 + (stayTimer / 3.0) * 0.2; } 
                    else if (imageState === 'DISPERSING') { subP = 0.6 + (1.0 - pd.progress) * 0.4; } 
                    
                    let totalProgress = (currentImgIdx * 25) + (subP * 25);
                    if (loopCount > 0) totalProgress = 100;
                    if (totalProgress > 99.9) totalProgress = 100;
                    
                    document.getElementById('progress-bar').style.width = totalProgress + '%';
                    document.getElementById('progress-text').innerText = Math.floor(totalProgress) + '%';

                    mat.opacity = (pd.progress < 0.5 ? 2 * pd.progress * pd.progress : -1 + (4 - 2 * pd.progress) * pd.progress) * 1.0; 

                    const timeX = timeTotal * 18.5, timeY = timeTotal * 19.2, timeZ = timeTotal * 20.0;
                    const p0x = pinchers[0].pos.x, p0y = pinchers[0].pos.y, p1x = pinchers[1].pos.x, p1y = pinchers[1].pos.y;
                    const p2x = pinchers[2].pos.x, p2y = pinchers[2].pos.y, p3x = pinchers[3].pos.x, p3y = pinchers[3].pos.y;
                    const phases = pd.phases, mobilities = pd.mobilities, distRatios = pd.distRatios, targetPositions = pd.targetPositions, randomPositions = pd.randomPositions;
                    const invRad = 1.0 / 45.0, radSq = 2025.0, t50 = timeTotal * 50.0;

                    for(let i = 0; i < posArr.length; i += 3) {
                        const idx = i / 3, mob = mobilities[idx], ph = phases[idx], distR = distRatios[idx];
                        let localProg = pd.progress * 1.5 - distR * 0.5;
                        if (localProg > 1) localProg = 1; if (localProg < 0) localProg = 0;
                        let localEaseP = localProg < 0.5 ? 2 * localProg * localProg : -1 + (4 - 2 * localProg) * localProg;

                        let cX = (randomPositions[i] + Math.cos(timeTotal * 0.8 + ph) * 15) + ((targetPositions[i] + Math.sin(timeX + ph * 2.0) * 0.15 * mob) - (randomPositions[i] + Math.cos(timeTotal * 0.8 + ph) * 15)) * localEaseP;
                        let cY = (randomPositions[i+1] + Math.sin(timeTotal * 1.2 + ph) * 15) + ((targetPositions[i+1] + Math.cos(timeY + ph * 3.0) * 0.15 * mob) - (randomPositions[i+1] + Math.sin(timeTotal * 1.2 + ph) * 15)) * localEaseP;
                        let cZ = (randomPositions[i+2] + Math.sin(timeTotal * 1.0 + ph) * 15) + ((targetPositions[i+2] + Math.sin(timeZ + ph * 4.0) * 0.4  * mob) - (randomPositions[i+2] + Math.sin(timeTotal * 1.0 + ph) * 15)) * localEaseP;

                        let aX = 0, aY = 0, aZ = 0;
                        if (localEaseP > 0.5) {
                            const ph100 = ph * 100.0; let dx, dy, distSq, factor;
                            const checkPincher = (px, py) => {
                                dx = cX - px; dy = cY - py; distSq = dx*dx + dy*dy;
                                if (distSq < radSq) { factor = 1.0 - (Math.sqrt(distSq) * invRad); factor *= factor; aX += Math.sin(t50 + ph100) * 1.5 * factor; aY += Math.cos(t50 + ph100 * 1.2) * 1.5 * factor; aZ += Math.sin(t50 + ph100 * 0.8) * 4.0 * factor; }
                            };
                            checkPincher(p0x, p0y); checkPincher(p1x, p1y); checkPincher(p2x, p2y); checkPincher(p3x, p3y);
                        }
                        posArr[i] = cX + aX; posArr[i+1] = cY + aY; posArr[i+2] = cZ + aZ;
                    }
                    particleSystem.geometry.attributes.position.needsUpdate = true;
                    particleSystem.quaternion.copy(camera.quaternion); 
                }

                const breath = Math.sin(timeTotal * 2.5);
                topHalf.userData.nodeMat.size = bottomHalf.userData.nodeMat.size = 2.8 + breath * 1.2;     
                topHalf.userData.nodeMat.opacity = bottomHalf.userData.nodeMat.opacity = 0.65 + breath * 0.35; 

                updateDarningSystem();

                const cycle = timeTotal % 13.0; bottomHalf.rotation.y = topHalf.rotation.y = 0;
                if (cycle > 0 && cycle <= 1.0) bottomHalf.rotation.y = easeInOutQuad(cycle) * (Math.PI / 2); else if (cycle > 1.0 && cycle <= 6.5) bottomHalf.rotation.y = Math.PI / 2; 
                if (cycle > 0.5 && cycle <= 1.5) topHalf.rotation.y = easeInOutQuad(cycle - 0.5) * (Math.PI / 2); else if (cycle > 1.5 && cycle <= 6.5) topHalf.rotation.y = Math.PI / 2; 
                if (cycle > 6.5 && cycle <= 7.5) topHalf.rotation.y = Math.PI / 2 - easeInOutQuad(cycle - 6.5) * (Math.PI / 2); else if (cycle > 7.5) topHalf.rotation.y = 0;
                if (cycle > 7.0 && cycle <= 8.0) bottomHalf.rotation.y = Math.PI / 2 - easeInOutQuad(cycle - 7.0) * (Math.PI / 2); else if (cycle > 8.0) bottomHalf.rotation.y = 0;

                updateLabels(); renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => { 
                if (!p5Wrapper.classList.contains('active')) return;
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); 
            });

            // 供外部调用的重置函数
            window.resetPage5 = function() {
                cancelAnimationFrame(animationId);
                p5CanvasContainer.style.opacity = '1';
                p5UiLayer.style.opacity = '1';
                document.getElementById('p5-nav').style.opacity = '1';
                document.getElementById('next-btn').style.display = 'none';
                currentImgIdx = 0;
                loopCount = 0;
                timeTotal = 0;
                loadDataImage(imageList[currentImgIdx]);
                animateP5();
            };

            // 首次加载初始化
            loadDataImage(imageList[currentImgIdx]); 
            animateP5();
        };

        // ================= 第二部分整合逻辑：进入最终生成阶段 =================
        window.startPart2 = function() {
            // 淡出第五页的粒子层
            const p5Wrapper = document.getElementById('page5-wrapper');
            p5Wrapper.style.transition = "opacity 1s ease";
            p5Wrapper.style.opacity = '0';
            
            setTimeout(() => {
                p5Wrapper.style.display = 'none';
                p5Wrapper.classList.remove('active');

                // 显示第二部分的超级外衣
                const part2Wrapper = document.getElementById('part2-wrapper');
                part2Wrapper.style.display = 'block';
                
                requestAnimationFrame(() => {
                    part2Wrapper.style.opacity = '1';

                    // 启动原本第二部分开头的逻辑（加载动画 -> 展示画廊）
                    const sceneLoading = document.getElementById('scene-loading');
                    const sceneGallery = document.getElementById('scene-gallery');

                    sceneLoading.style.display = 'flex';
                    requestAnimationFrame(() => {
                        sceneLoading.style.opacity = '1';
                    });

                    setTimeout(() => {
                        sceneLoading.style.opacity = '0';
                        setTimeout(() => {
                            sceneLoading.style.display = 'none';
                            sceneGallery.style.display = 'block';
                            requestAnimationFrame(() => {
                                sceneGallery.style.opacity = '1';
                                sceneGallery.classList.add('active');
                            });
                        }, 800); 
                    }, 3000); 
                });
            }, 1000);
        };

        // 第二部分：启动数字崩溃故障转场
        window.startGlitchTransition = function() {
            const sceneGallery = document.getElementById('scene-gallery');
            const videoGlitchMaster = document.getElementById('video-glitch-master');
            const sceneGlitch = document.getElementById('scene-glitch');
            const matrixWall = document.getElementById('matrix-wall');
            const nextArrowBtn = document.getElementById('next-arrow-btn');

            sceneGallery.classList.add('glitching');
            videoGlitchMaster.classList.add('show');

            // 3秒后关闭特效，进入高级矩阵场景
            setTimeout(() => {
                sceneGallery.style.display = 'none';
                sceneGallery.classList.remove('glitching'); 
                videoGlitchMaster.style.display = 'none';
                videoGlitchMaster.classList.remove('show');

                sceneGlitch.style.display = 'block';
                requestAnimationFrame(() => {
                    sceneGlitch.style.opacity = '1';
                    
                    // 构建并渲染高级数据墙
                    buildMatrixWall(matrixWall);
                    
                    // 矩阵墙展示 5 秒后，出现右箭头
                    setTimeout(() => {
                        nextArrowBtn.classList.add('show');
                    }, 5000);
                });
            }, 3000); 
        };

        // 第二部分：构建高级 AI 数据矩阵墙
        window.buildMatrixWall = function(container) {
            const categories = [
                "京剧", "京剧行当", "京剧行头", "京剧脸谱", "京剧化妆", "京剧砌末", "京剧程式",
                "京剧剧目", "京剧人物", "京剧名伶", "京剧艺术家", "梅兰芳",
                "京剧演员戏装照", "京剧演员便装照", "京剧演出", "京剧舞台", "京剧戏院",
                "京剧观众", "京剧画报", "新媒体宣传京剧", "京剧广告", "京剧文创产品",
                "京剧插画", "京剧书画作品", "京剧电影", "京剧电视节目", "京剧虚拟数字人",
                "VR京剧", "京剧游戏", "京剧传承"
            ];
            
            const allImages = [];
            
            // 组装文件名
            categories.forEach(category => {
                for (let i = 1; i <= 16; i++) {
                    let finalCategory = category;
                    if (category === "京剧名") finalCategory = "京剧名伶";
                    if (category === "京剧剧书画作品") finalCategory = "京剧书画作品";
                    allImages.push(`${finalCategory}${i}.png`);
                }
            });

            // 彻底打乱这480张图的排列顺序
            for (let i = allImages.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allImages[i], allImages[j]] = [allImages[j], allImages[i]];
            }

            const fragment = document.createDocumentFragment();
            
            // 生成DOM结构
            allImages.forEach((src, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'matrix-wrapper';
                wrapper.style.animationDelay = `${Math.random() * 3.5}s`;

                const img = document.createElement('img');
                img.src = src;
                img.className = 'matrix-img';
                img.decoding = "async"; // 保持性能
                
                // 让大约 25% 的图片带上 AI 正在“分析提取”的扫描高光动效
                if (Math.random() > 0.75) {
                    img.classList.add('analyzing');
                    img.style.animationDuration = `${3 + Math.random() * 5}s`;
                    img.style.animationDelay = `-${Math.random() * 8}s`; 
                }

                wrapper.appendChild(img);
                fragment.appendChild(wrapper);
            });

            container.appendChild(fragment);
        };

        // 第二部分：跳转到终极黑屏疑问页
        window.goToAiQuestion = function() {
            const sceneGlitch = document.getElementById('scene-glitch');
            const sceneAi = document.getElementById('scene-ai-question');
            const matrixWall = document.getElementById('matrix-wall');

            sceneGlitch.style.opacity = '0';

            setTimeout(() => {
                sceneGlitch.style.display = 'none';
                matrixWall.innerHTML = ''; // 释放极大内存保证流畅

                sceneAi.style.display = 'flex';
                
                requestAnimationFrame(() => {
                    sceneAi.style.opacity = '1';
                });
            }, 1500);
        };

        // 第二部分：灯箱逻辑
        window.openLightbox = function(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imageSrc;
            lightbox.classList.add('show');
            requestAnimationFrame(() => { lightbox.style.opacity = '1'; });
        };

        window.closeLightbox = function() {
            const lightbox = document.getElementById('lightbox');
            lightbox.style.opacity = '0';
            setTimeout(() => {
                lightbox.classList.remove('show');
                document.getElementById('lightbox-img').src = '';
            }, 300);
        };

    </script>
</body>
